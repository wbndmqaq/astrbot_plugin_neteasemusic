# 插件 lint 基线：与 astrbot_plugin_qqmusic 保持一致的防御性写法
line-length = 120
extend-exclude = ["_smoke_test.py", "_fix_regex.py"]

[lint]
ignore = [
    "BLE001",   # 插件防崩的兜底捕获（刻意，与 qqmusic 插件一致）
    "S110",     # try/except/pass 兜底（刻意）
    "RUF012",   # SessionStore._mem 类级内存缓存（刻意）
    "DTZ006",   # 评论时间仅展示用，按本地时区格式化
    "ASYNC230", # 小文件（二维码/音频）同步写入，量小无碍（同 qqmusic）
    "PIE810",   # tpl_adapter 为 qqmusic 原样复制的转换器
    "PLR0124",  # _num() 的 NaN 守卫 f == f（刻意）
]
